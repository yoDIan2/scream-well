<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>尖叫之井</title>
<link rel="stylesheet" href="./style.css?v=m57">
</head>
<body>
<div id="safe-probe" aria-hidden="true"></div>
<div id="proto-bar">
  <span id="proto-tag">m57</span>
  <button type="button" class="xb" id="btn-bar-min">收起</button>
  <button type="button" class="xb" id="btn-x1">3血</button>
  <button type="button" class="xb" id="btn-x2">2血</button>
  <button type="button" class="xb" id="btn-x3">1血</button>
  <button type="button" id="btn-restart">重开</button>
  <button type="button" id="btn-jump">下跳10层</button>
  <button type="button" id="btn-boss">到井底</button>
  <button type="button" id="btn-flood">山洪</button>
  <button type="button" id="btn-debug">调试</button>
  <button type="button" id="btn-audio">音频:开</button>
  <button type="button" id="btn-t-magnet">磁吸</button>
  <button type="button" id="btn-t-hard">硬着陆</button>
  <button type="button" id="btn-t-fish">拦路蛛</button>
  <button type="button" id="btn-t-ammo">无限弹</button>
  <button type="button" class="xb" id="btn-top-minus">顶距-</button>
  <button type="button" class="xb" id="btn-top-plus">顶距+</button>
</div>
<div id="stage">
  <canvas id="cv"></canvas>
</div>
<button type="button" id="btn-pause">暂停</button>
<div id="home">
  <div id="home-inner">
    <div id="home-kicker">王国史 · 第二章</div>
    <div id="home-title">尖叫之井</div>
    <div id="home-tier">
      <div class="ht" id="ht1"><b>简单</b><span>3 血</span></div>
      <div class="ht" id="ht2"><b>标准</b><span>2 血</span></div>
      <div class="ht" id="ht3"><b>困难</b><span>1 血</span></div>
    </div>
    <button type="button" id="btn-start">下井</button>
    <div id="home-stat"></div>
    <div id="home-foot">
      <span id="home-ver"></span>
      <button type="button" id="btn-howto">怎么玩</button>
      <button type="button" id="btn-mute">音频:开</button>
    </div>
  </div>
</div>
<div id="howto" class="hidden">
  <div id="howto-card">
    <div id="howto-title">怎么玩</div>
    <div class="hl"><b>按住左／右侧</b><span>往那边走，同时往下吐籽</span></div>
    <div class="hl"><b>吐籽的后坐力</b><span>是你唯一的升力</span></div>
    <div class="hl"><b>坝</b><span>挡住去路，打穿它才能下</span></div>
    <div class="hl"><b>壁刺和住户</b><span>碰一下就掉血，1 血档碰一下就死</span></div>
    <div class="hl"><b>潭水</b><span>在你脚下涨，漫到就回井口</span></div>
    <div class="hl"><b>每 10 层</b><span>三选一，选一张会烧掉一张</span></div>
    <div class="hl"><b>井底</b><span>暗河里有东西，打穿它才算通关</span></div>
    <button type="button" id="btn-howto-close">知道了</button>
  </div>
</div>
<div id="pause" class="hidden">
  <div id="pause-card">
    <div id="pause-title">停一下</div>
    <button type="button" id="btn-resume">继续下井</button>
    <button type="button" id="btn-menu">返回主菜单</button>
  </div>
</div>
<div id="result" class="hidden">
  <div id="result-card">
    <!-- 上半：分享卡。战报图就是结算主体，文字只在图没生成成功时兜底 -->
    <div id="result-share">
      <img id="report-img" class="hidden" alt="今日战报">
      <div id="result-text" class="hidden">
        <div id="result-title">被水冲回井口了</div>
        <div id="result-depth">第 1 层</div>
        <div id="result-meta"></div>
      </div>
      <div id="share-btns" class="hidden">
        <button type="button" id="btn-album">存相册</button>
        <button type="button" id="btn-note">发笔记</button>
      </div>
      <div id="share-status"></div>
    </div>
    <!-- 下半：菜单，竖排 -->
    <div id="result-menu">
      <button type="button" id="btn-again">再来一局</button>
      <button type="button" id="btn-home">主菜单</button>
    </div>
  </div>
</div>
<div id="pick3" class="hidden">
  <div id="pick3-card">
    <div id="pick3-title">坝缝里捡到点什么？</div>
    <button type="button" class="p3" id="p3-0"></button>
    <button type="button" class="p3" id="p3-1"></button>
    <button type="button" class="p3" id="p3-2"></button>
    <div id="pick3-hint">点一张带走 · 另两张里会烧掉一张，本局不再出现</div>
  </div>
</div>
<script src="./game.js?v=m57"></script>
</body>
</html>
